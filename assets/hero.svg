<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Prem S — Full Stack and Mobile App Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#101A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E2A44" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif}
      .m{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .fade{animation:in .9s ease backwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .orbit{transform-origin:960px 170px;animation:spin 28s linear infinite}
      .orbit2{transform-origin:960px 170px;animation:spin 40s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect y="0" width="1200" height="3" fill="url(#accent)"/>

    <!-- left: identity -->
    <g class="t">
      <text x="64" y="86" class="m fade d1" font-size="15" fill="#5EEAD4" letter-spacing="2">// SOFTWARE ENGINEER · COIMBATORE, IN</text>
      <text x="62" y="160" class="fade d2" font-size="72" font-weight="800" fill="#F1F5F9" letter-spacing="-1.5">Prem S</text>
      <text x="64" y="204" class="fade d3" font-size="26" font-weight="600" fill="url(#accent)">Full Stack &amp; Mobile App Developer</text>
      <g class="fade d4">
        <text x="64" y="252" class="m" font-size="15" fill="#94A3B8">
          <tspan fill="#A78BFA">$</tspan> ship --apps <tspan fill="#E2E8F0">React Native · Flutter</tspan> --api <tspan fill="#E2E8F0">Node · Spring Boot · Laravel</tspan>
        </text>
        <text x="64" y="280" class="m" font-size="15" fill="#94A3B8">
          <tspan fill="#A78BFA">$</tspan> status <tspan fill="#5EEAD4">✔ live on Google Play &amp; App Store</tspan><tspan class="cursor" fill="#5EEAD4"> ▍</tspan>
        </text>
      </g>
    </g>

    <!-- right: phone + orbiting stack -->
    <g opacity="0.95">
      <circle cx="960" cy="170" r="128" fill="none" stroke="#1E3A5F" stroke-dasharray="3 7"/>
      <circle cx="960" cy="170" r="88" fill="none" stroke="#1E3A5F" stroke-dasharray="2 6"/>
      <g class="orbit">
        <circle cx="1088" cy="170" r="7" fill="#5EEAD4"/>
        <circle cx="832" cy="170" r="5" fill="#A78BFA"/>
        <circle cx="960" cy="42" r="4" fill="#60A5FA"/>
      </g>
      <g class="orbit2">
        <circle cx="960" cy="258" r="6" fill="#60A5FA"/>
        <circle cx="1048" cy="170" r="4" fill="#5EEAD4"/>
      </g>
      <!-- phone -->
      <rect x="912" y="84" width="96" height="172" rx="16" fill="#0B1222" stroke="url(#accent)" stroke-width="2"/>
      <rect x="944" y="92" width="32" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="922" y="108" width="76" height="40" rx="7" fill="#13213B"/>
      <path d="M928 140 C944 116, 962 132, 974 118 S 992 124, 994 114" fill="none" stroke="#5EEAD4" stroke-width="2"/>
      <circle cx="994" cy="114" r="3" fill="#5EEAD4" class="pulse"/>
      <rect x="922" y="156" width="54" height="7" rx="3.5" fill="#334155"/>
      <rect x="922" y="169" width="40" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="922" y="188" width="76" height="22" rx="7" fill="#1D4ED8"/>
      <rect x="922" y="218" width="76" height="22" rx="7" fill="none" stroke="#334155"/>
    </g>

    <text x="1136" y="318" class="m" font-size="12" fill="#475569" text-anchor="end">github.com/kingprem12</text>
  </g>
</svg>
